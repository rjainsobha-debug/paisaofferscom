<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaisaOffers - Best Deals</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
}

.header {
  background: #ff3f34;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
}

.title {
  font-size: 14px;
  height: 40px;
  overflow: hidden;
}

.price {
  margin-top: 8px;
}

.new-price {
  color: #27ae60;
  font-weight: bold;
  font-size: 18px;
}

.old-price {
  text-decoration: line-through;
  color: gray;
  margin-left: 8px;
}

.btn {
  display: block;
  text-align: center;
  margin-top: 10px;
  padding: 8px;
  background: #ff3f34;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-size: 14px;
}

.btn:hover {
  background: #e84118;
}

.badge {
  position: absolute;
  background: #ff3f34;
  color: white;
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 5px;
  top: 10px;
  left: 10px;
}

.card-wrapper {
  position: relative;
}
</style>

</head>
<body>

<div class="header">
🔥 PaisaOffers - Best Deals
</div>

<div class="container" id="dealsContainer">
Loading deals...
</div>

<script>
// 🔥 PUT YOUR WORKER URL HERE
const API_URL = "https://deals-api.rjain-sobha.workers.dev";

async function loadDeals() {
  const res = await fetch(API_URL);
  const data = await res.json();

  const container = document.getElementById("dealsContainer");
  container.innerHTML = "";

  data.forEach(deal => {

    const discount = Math.round(
      ((deal.old_price - deal.new_price) / deal.old_price) * 100
    );

    const card = `
    <div class="card">
      <div class="card-wrapper">
        <img src="${deal.image}" />
        <div class="badge">${discount}% OFF</div>
      </div>

      <div class="card-content">
        <div class="title">${deal.title}</div>

        <div class="price">
          <span class="new-price">₹${deal.new_price}</span>
          <span class="old-price">₹${deal.old_price}</span>
        </div>

        <a class="btn" href="${deal.link}" target="_blank">
          👉 Grab Deal
        </a>
      </div>
    </div>
    `;

    container.innerHTML += card;
  });
}

loadDeals();
</script>

</body>
</html>
