<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Deals - PaisaOffers</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="navbar">
  <div class="logo">💰 PaisaOffers</div>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="deals.html">Deals</a>
    <a href="coupons.html">Coupons</a>
    <a href="stores.html">Stores</a>
  </nav>
</header>

<div class="container">

<!-- LEFT FILTER -->
<aside class="sidebar">
  <h3>Filters</h3>
  
  <label>Category</label>
  <select>
    <option>All</option>
    <option>Electronics</option>
    <option>Fashion</option>
  </select>

  <label>Discount</label>
  <select>
    <option>10%+</option>
    <option>30%+</option>
    <option>50%+</option>
  </select>

  <label>Sort</label>
  <select>
    <option>Newest</option>
    <option>Popular</option>
  </select>
</aside>

<!-- DEALS GRID -->
<main class="deals-grid">

  <div class="deal-card">
    <img src="https://placehold.co/300x200">
    <h3>iPhone Deal</h3>
    <p><span class="old">₹80,000</span> ₹60,000</p>
    <button>Get Deal</button>
  </div>

  <div class="deal-card">
    <img src="https://placehold.co/300x200">
    <h3>Headphones</h3>
    <p><span class="old">₹5,000</span> ₹2,500</p>
    <button>Get Deal</button>
  </div>

</main>

</div>

</body>
</html>
